<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8">
    <title>eBay Helper foreign-currency item fixture</title>
    <link rel="stylesheet" href="../content.css">
  </head>
  <body>
    <main id="mainContent">
      <h1 class="x-item-title__mainTitle">Lenovo ThinkPad T14 Gen 1 i5-10310U 16GB RAM 256GB</h1>
      <div class="x-price-section">
        <div class="x-price-primary" data-testid="x-price-primary">
          <span class="x-price-primary__price"><span class="ux-textspans">EUR 259.00</span></span>
          <span class="x-price-primary__orBestOffer"><span class="ux-textspans">or Best Offer</span></span>
        </div>
        <div class="x-price-approx" data-testid="x-price-approx">
          <span class="x-price-approx__label"><span class="ux-textspans">Approximately</span></span>
          <span class="x-price-approx__price"><span class="ux-textspans">US $290.08</span></span>
        </div>
      </div>
      <div class="ux-labels-values--shipping">Shipping: EUR 20.00 (approx US $22.40) eBay International Shipping</div>
    </main>
  </body>
</html>
